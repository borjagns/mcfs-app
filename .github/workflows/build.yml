name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Cordova APK
      run: |
        npm install -g cordova
        
        cordova create app com.gnsapps.micarrera "Mi Carrera Futbolistica" --version=0.1.0
        cd app
        
        rm -rf www/*
        cp ../index.html www/
        
        if [ -f ../icon.png ]; then
          cp ../icon.png www/icon.png
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' config.xml
        fi

        cordova platform add android
        cordova build android --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/platforms/android/app/build/outputs/apk/release/*.apk
