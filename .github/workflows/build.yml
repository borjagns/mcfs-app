name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Cordova APK and AAB
      run: |
        npm install -g cordova
        
        # Crear la app
        cordova create app com.gnsapps.micarrera "MiCarreraFutbolistica"
        cd app
        
        # Cambiar versión en config.xml
        sed -i 's/version="1.0.0"/version="0.1.0"/g' config.xml
        
        # Copiar index.html
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Copiar icono si existe
        if [ -f ../icon.png ]; then
          cp ../icon.png www/icon.png
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" \/>' config.xml
        fi

        # Añadir plataforma Android y compilar APK y AAB
        cordova platform add android
        cordova build android --release --packageType=apk
        cordova build android --release --packageType=bundle

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-files
        path: |
          app/platforms/android/app/build/outputs/apk/release/*.apk
          app/platforms/android/app/build/outputs/bundle/release/*.aab
