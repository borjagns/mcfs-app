name: Build Android APK and AAB from HTML

on:
  push:
    branches:
      - main  # Cambia a 'master' si tu rama principal se llama así
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta web para Capacitor
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.html *.js *.css *.png *.jpg www/ 2>/dev/null || true

      - name: Inicializar proyecto Capacitor y Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MiJuego" "com.mijuego.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK y AAB
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Subir APK y AAB generados
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
