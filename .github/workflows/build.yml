name: Build Signed Android AAB and Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta web para Capacitor
        run: |
          mkdir -p www
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.html *.js *.css *.png *.jpg www/ 2>/dev/null || true

      - name: Inicializar proyecto Capacitor y Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Mi Carrera Futbolistica Sim" "com.micarrerafutbolistica.sim" --web-dir www
          npx cap add android

      - name: Generar icono desde icon.png
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi
          npx cap copy android
          npx cap sync android

      - name: Decodificar Keystore desde Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configurar firma Release, minSdk 24 y Kotlin
        run: |
          find android -name "*.gradle" -exec sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' {} +
          find android -name "*.gradle" -exec sed -i 's/minSdkVersion 23/minSdkVersion 24/g' {} +
          cat << 'EOF' >> android/app/build.gradle
          
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug y AAB Release Firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Subir APK y AAB generados
        uses: actions/upload-artifact@v4
        with:
          name: mi-carrera-futbolistica
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
