name: Build Android APK and AAB

on:
  push:
    branches:
      - main  # O la rama principal que utilices (ej. master)
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Compilar AAB (App Bundle)
        run: ./gradlew bundleDebug

      - name: Subir APK generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Subir AAB generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-release.aab
          app/platforms/android/app/build/outputs/apk/release/*.apk
          app/platforms/android/app/build/outputs/bundle/release/*.aab
